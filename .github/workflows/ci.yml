name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile && bun install --cwd schematics --frozen-lockfile
      - name: Block new .mjs files
        run: bun scripts/check-mjs-ratchet.ts
      - name: Type-check TypeScript sources
        run: bun check
      - name: Generated outputs and golden renders
        run: bun run test:generated
      - name: All tests
        run: bun run test:all

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Provision a known Chrome runtime
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Install dependencies
        run: bun install --frozen-lockfile && bun install --cwd schematics --frozen-lockfile
      - name: Browser tests
        run: bun run test:browser
        env:
          SCHEMATICS_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
          SCHEMATICS_CHROME_NO_SANDBOX: '1'
